{{- $title := .title | default site.Title }}
{{- $plainTitle := $title | plainify }}
{{- $tw := .typewriter | default dict }}
{{- if ($tw.enabled | default false) }}
<h1
  class="hero-typewriter"
  aria-label="{{ $plainTitle }}"
  data-config="{{ $tw | jsonify }}"
>
  <span class="hero-typewriter__inner"><span class="hero-typewriter__content" data-words="{{ $plainTitle }}"></span><span class="hero-typewriter__cursor" aria-hidden="true">{{ $tw.cursorCharacter | default "|" }}</span></span>
  <noscript>{{ $title }}</noscript>
</h1>
{{- else }}
<h1>{{ $title | markdownify }}</h1>
{{- end }}
