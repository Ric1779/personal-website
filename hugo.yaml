baseURL: http://localhost:1314/
locale: en-us
title: Richards' Workspace
theme: ["PaperMod", "hugo-shortcode-gallery"]

enableRobotsTXT: true

caches:
  images:
    dir: :cacheDir/images

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  minifyOutput: true

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - '\('
              - '\)'
            - - $
              - $

params:
  env: production
  hideFooter: true

  title: RichardsBritto
  description: "Document my learning notes."
  keywords: [Blog, Portfolio, SLAM, Deep Learning, Computer Vision]
  author: Richards Britto
  DateFormat: "January 2, 2006"
  defaultTheme: dark # auto, dark, light
  disableThemeToggle: false
  math: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  label:
    text: "Richards' Workspace"
    iconHeight: 35
    gradient:
      enabled: true
      colorsDark:
        - "#5227FF"
        - "#FF9FFC"
        - "#B497CF"
      colorsLight:
        - "#4F46E5"
        - "#7C3AED"
        - "#C026D3"
      animationSpeed: 7
      pauseOnHover: false

  profileMode:
    enabled: true
    title: "WELCOME VÄLKOMMEN VANAKKAM NAMASKARAM NAMASTE WELCOME"
    titleFontSize: "4rem"
    titleFontWeight: "400"

    typewriter:
      enabled: true
      typingSpeed: 200
      pauseBetweenWords: 400
      pauseDuration: 1500
      deletingSpeed: 100
      loop: false
      cursorCharacter: "_"
      cursorBlinkDuration: 0.5
    
    subtitle: "A curious earthling 🌱 looking for optimal solutions under the specified 
    constraints and trying to function at different levels of abstraction. In this chronicle, 
    I share my expedition of learning in the domains of deep learning, and computer vision."
    subtitleFontSize: "1.125rem"
    subtitleFontWeight: "400"

    imageUrl: "images/dp_10.png"
    imageWidth: 120
    imageHeight: 120

    dock:
      enabled: true
      magnification: 1.3
      distance: 200
      baseItemSize: 50

    buttons:
      - name: Blogs
        url: blogs
        icon: rss
      - name: Projects
        url: projects
        icon: github
      - name: Resume
        url: docs/RESUME.pdf
        icon: cv

  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my blog

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/ric1779/"
    - name: github
      url: "https://github.com/Ric1779"
    - name: instagram
      url: "https://www.instagram.com/crichardsbritto/"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 1
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 8
    - name: Search
      url: search/
      weight: 9