baseURL: http://localhost:1314/
locale: en-us
title: Richards' Workspace
theme: ["PaperMod", "hugo-shortcode-gallery"]

enableRobotsTXT: true

# caches:
#   images:
#     dir: :cacheDir/images

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  minifyOutput: true

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - '\('
              - '\)'
            - - $
              - $

params:
  env: production
  hideFooter: true

  title: RichardsBritto
  description: "Document my learning notes."
  keywords: [Blog, Portfolio, SLAM, Deep Learning, Computer Vision]
  author: Richards Britto
  DateFormat: "January 2, 2006"
  defaultTheme: dark # auto, dark, light
  disableThemeToggle: false
  math: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  label:
    text: "Richards' Workspace"
    iconHeight: 35
    gradient:
      enabled: true
      colorsDark:
        - "#a684ff"
        - "#00bcff"
        - "#0084d1"
      colorsLight:
        - "#00bcff"
        - "#0084d1"
        - "#00598a"
      animationSpeed: 7
      pauseOnHover: false

  profileMode:
    enabled: true
    title: "WELCOME VÄLKOMMEN VANAKKAM NAMASKARAM NAMASTE WELCOME"
    titleFontSize: "4rem"
    titleFontWeight: "400"

    typewriter:
      enabled: true
      typingSpeed: 200
      pauseBetweenWords: 400
      pauseDuration: 1500
      deletingSpeed: 100
      loop: false
      cursorCharacter: "_"
      cursorBlinkDuration: 0.5
    
    subtitle: "A curious 🌱 earthling trying to understand the world by moving between 
    different levels of abstraction. In this chronicle, I share my expedition of learning 
    in the domains of deep learning, and computer vision."
    subtitleFontSize: "1.125rem"
    subtitleFontWeight: "400"

    imageUrl: "images/dp_10.png"
    imageWidth: 100
    imageHeight: 100

    dock:
      enabled: true
      magnification: 1.3
      distance: 200
      baseItemSize: 50

    buttons:
      - name: Home
        url: /
        icon: home
      - name: About
        url: about
        icon: user
      - name: Blogs
        url: blogs
        icon: book-open
      - name: Projects
        url: projects
        icon: folder
      - name: 3D
        url: 3d
        icon: box
      - name: Drawing
        url: drawing
        icon: edit-2
      - name: Resume
        url: docs/RESUME.pdf
        icon: file-text

  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my blog

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/ric1779/"
    - name: github
      url: "https://github.com/Ric1779"
    - name: instagram
      url: "https://www.instagram.com/crichardsbritto/"

  postEntry:
    hoverBorder:
      light: "#6a7282"
      dark: "#6a7282"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

menu:
  main:
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 8
      params:
        icon: tag
    - identifier: search
      name: Search
      url: search/
      weight: 9
      params:
        icon: search