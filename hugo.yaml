baseURL: http://localhost:1314/
locale: en-us
title: Richards' Workspace
theme: ["PaperMod", "hugo-shortcode-gallery"]

enableRobotsTXT: true

caches:
  images:
    dir: :cacheDir/images

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  minifyOutput: true

params:
  env: production
  hideFooter: true

  math: true
  defaultTheme: "dark"
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  label:
    text: "Richards' Workspace"
    icon: "images/camera.png"
    iconHeight: 35
    gradient:
      enabled: true
      colorsDark:
        - "#5227FF"
        - "#FF9FFC"
        - "#B497CF"
      colorsLight:
        - "#4F46E5"
        - "#7C3AED"
        - "#C026D3"
      animationSpeed: 7
      pauseOnHover: false

  profileMode:
    enabled: true
    title: "WELCOME VÄLKOMMEN VANAKKAM NAMASKARAM NAMASTE WELCOME"
    titleFontSize: "4rem"
    titleFontWeight: "300"

    typewriter:
      enabled: true
      typingSpeed: 200
      pauseBetweenWords: 400
      pauseDuration: 1500
      deletingSpeed: 100
      loop: false
      cursorCharacter: "_"
      cursorBlinkDuration: 0.5
    
    subtitle: "A curious earthling 🌱 looking for optimal solutions under the specified 
    constraints and trying to function at different levels of abstraction. In this chronicle, 
    I share my expedition of learning in the domains of deep learning, and computer vision."
    subtitleFontSize: "1.125rem"
    subtitleFontWeight: "400"

    imageUrl: "images/dp_10.png"
    imageWidth: 100
    imageHeight: 100
    imageTitle: "Ric"

    dock:
      enabled: true
      magnification: 1.3
      distance: 200
      baseItemSize: 50

    buttons:
      - name: Blogs
        url: blogs
        icon: rss
      - name: Projects
        url: projects
        icon: github
      - name: Resume
        url: docs/RESUME.pdf
        icon: cv

  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my blog

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/ric1779/"
    - name: github
      url: "https://github.com/Ric1779"
    - name: instagram
      url: "https://www.instagram.com/crichardsbritto/"
menu:
  main:
    - identifier: about
      name: About
      url: /about/